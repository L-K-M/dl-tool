name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: make setup
      - run: make lint
      - run: make vet
      - run: make typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: make setup
      - run: make test

  gen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: probe
        run: |
          if test -f api/openapi.json; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if test -n "$base" && git cat-file -e "$base:api/openapi.json" 2>/dev/null; then
            echo "::error::api/openapi.json existed before this change but is now missing"
            exit 1
          fi

          echo "ready=no" >> "$GITHUB_OUTPUT"
      - if: steps.probe.outputs.ready != 'yes'
        run: echo "::warning::api/openapi.json has not been introduced; skipping API contract drift check"
      - if: steps.probe.outputs.ready == 'yes'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - if: steps.probe.outputs.ready == 'yes'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - if: steps.probe.outputs.ready == 'yes'
        run: make setup
      - if: steps.probe.outputs.ready == 'yes'
        name: Regenerate the API contract
        run: make gen
      - if: steps.probe.outputs.ready == 'yes'
        name: Fail if generated files drifted
        run: |
          if ! git diff --exit-code -- api/openapi.json web/src/api/schema.d.ts \
            || test -n "$(git status --porcelain -- api/openapi.json web/src/api/schema.d.ts)"; then
            echo "::error::generated API contract files drifted, are missing, or are untracked"
            exit 1
          fi

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          test -d internal/engine/enginetest && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"
      - if: steps.probe.outputs.ready == 'yes'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - if: steps.probe.outputs.ready == 'yes'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - if: steps.probe.outputs.ready == 'yes'
        run: make setup
      - if: steps.probe.outputs.ready == 'yes'
        run: make test-integration

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: |
          test -f compose.yaml && echo "ready=yes" >> "$GITHUB_OUTPUT" || echo "ready=no" >> "$GITHUB_OUTPUT"
      - if: steps.probe.outputs.ready == 'yes'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - if: steps.probe.outputs.ready == 'yes'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - if: steps.probe.outputs.ready == 'yes'
        run: make setup
      - if: steps.probe.outputs.ready == 'yes'
        run: make compose-check && make docker-build
